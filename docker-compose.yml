services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: npm run dev:web
    environment:
      VITE_API_URL: http://localhost:3333
      DISABLE_HMR: "false"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: sh -c "npm run prisma:generate && npm run prisma:deploy && npm run prisma:seed && npm run dev:api"
    environment:
      NODE_ENV: development
      PORT: "3333"
      DATABASE_URL: postgresql://grao_origem:grao_origem@db:5432/grao_origem
      APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-local-mock-webhook-token-32-characters}
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grao_origem
      POSTGRES_PASSWORD: grao_origem
      POSTGRES_DB: grao_origem
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grao_origem -d grao_origem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  web_node_modules:
  api_node_modules:
  postgres_data:
